[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "carla-osi-publisher"
version = "0.1.0"
description = "CARLA 0.9.16 to ASAM OSI 3.8.0 publisher"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
dependencies = [
    "asam-osi-utilities",
    "mcap>=1.2.2",
    "mcap-protobuf-support>=0.5.3",
    "protobuf>=6.30.2,<7",
    "osi-python",
    "carla==0.9.16",
]

[project.scripts]
carla-osi = "carla_osi_publisher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carla_osi_publisher"]
